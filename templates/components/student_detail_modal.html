<!-- 学员详情弹窗模态框 -->
<div id="studentDetailModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
        <!-- 模态框头部 -->
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center">
                <span class="material-symbols-outlined text-blue-600 mr-2">person</span>
                <h3 class="text-lg font-medium text-gray-900">学员详情</h3>
            </div>
            <button onclick="closeStudentDetailModal()" class="text-gray-400 hover:text-gray-600">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>

        <!-- 模态框内容 -->
        <div class="mt-3">
            <!-- 加载状态 -->
            <div id="studentDetailLoading" class="text-center py-8">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-200 border-t-blue-600"></div>
                <p class="mt-3 text-gray-600 text-sm">加载中...</p>
            </div>

            <!-- 学员详情内容 -->
            <div id="studentDetailContent" class="hidden">
                <!-- 基本信息 -->
                <div class="mb-4">
                    <div class="flex items-center mb-3">
                        <span class="material-symbols-outlined text-blue-600 mr-2">account_circle</span>
                        <h4 class="text-sm font-medium text-gray-900">基本信息</h4>
                    </div>
                    <!-- 基本信息表格 -->
                    <div class="overflow-hidden border border-gray-200 rounded-lg">
                        <table class="min-w-full divide-y divide-gray-200">
                            <tbody class="bg-white divide-y divide-gray-200">
                                <tr>
                                    <td class="px-3 py-2 text-sm text-gray-600 bg-gray-50 w-1/3">学员姓名</td>
                                    <td id="studentName" class="px-3 py-2 text-sm font-medium text-gray-900">-</td>
                                </tr>
                                <tr>
                                    <td class="px-3 py-2 text-sm text-gray-600 bg-gray-50">年级</td>
                                    <td class="px-3 py-2">
                                        <span id="gradeDisplay" class="text-sm font-medium text-gray-900">-</span>
                                        <select id="gradeEdit" class="hidden w-full text-sm border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500">
                                            <option value="">请选择年级</option>
                                            <option value="1年级">1年级</option>
                                            <option value="2年级">2年级</option>
                                            <option value="3年级">3年级</option>
                                            <option value="4年级">4年级</option>
                                            <option value="5年级">5年级</option>
                                            <option value="6年级">6年级</option>
                                            <option value="7年级">7年级</option>
                                            <option value="8年级">8年级</option>
                                            <option value="9年级">9年级</option>
                                            <option value="高一">高一</option>
                                            <option value="高二">高二</option>
                                            <option value="高三">高三</option>
                                        </select>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="px-3 py-2 text-sm text-gray-600 bg-gray-50">家长微信名</td>
                                    <td id="parentWechatDisplayName" class="px-3 py-2 text-sm font-medium text-gray-900">-</td>
                                </tr>
                                <tr id="contactInfoRow">
                                    <td class="px-3 py-2 text-sm text-gray-600 bg-gray-50">联系方式</td>
                                    <td id="contactInfo" class="px-3 py-2 text-sm font-medium text-gray-900">-</td>
                                </tr>
                                <tr>
                                    <td class="px-3 py-2 text-sm text-gray-600 bg-gray-50">学校</td>
                                    <td class="px-3 py-2">
                                        <span id="schoolDisplay" class="text-sm font-medium text-gray-900">-</span>
                                        <input type="text" id="schoolEdit" class="hidden w-full text-sm border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500" placeholder="请输入学校名称">
                                    </td>

                                <tr>
                                    <td class="px-3 py-2 text-sm text-gray-600 bg-gray-50">行政区</td>

                                            <option value="黄浦区">黄浦区</option>
                                            <option value="徐汇区">徐汇区</option>
                                            <option value="长宁区">长宁区</option>
                                            <option value="静安区">静安区</option>
                                            <option value="普陀区">普陀区</option>
                                            <option value="虹口区">虹口区</option>
                                            <option value="杨浦区">杨浦区</option>
                                            <option value="闵行区">闵行区</option>
                                            <option value="宝山区">宝山区</option>

                <!-- 服务内容 -->

                    <div class="flex items-center mb-3">
                        <span class="material-symbols-outlined text-blue-600 mr-2">school</span>
                        <h4 class="text-sm font-medium text-gray-900">服务内容</h4>
                    </div>
                    <!-- 服务内容表格 -->
                    <div class="overflow-hidden border border-gray-200 rounded-lg">
                        <table class="min-w-full divide-y divide-gray-200">
                            <tbody id="serviceTableBody" class="bg-white divide-y divide-gray-200">
                                <!-- 动态生成服务行 -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 沟通记录 -->
                <div id="communicationContent" class="mb-4 hidden">
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center">
                            <span class="material-symbols-outlined text-blue-600 mr-2">chat</span>
                            <h4 class="text-sm font-medium text-gray-900" id="communicationTitle">沟通记录</h4>
                        </div>
                        <button id="addCommunicationButton" type="button" onclick="showAddStudentCommunicationModal()"
                                class="hidden inline-flex items-center px-3 py-1.5 border border-transparent text-xs font-medium rounded-lg text-white bg-blue-600 hover:bg-blue-700">
                            <span class="material-symbols-outlined text-sm mr-1">add</span>
                            新增记录
                        </button>
                    </div>
                    <!-- 沟通记录列表 -->
                    <div class="overflow-hidden border border-gray-200 rounded-lg max-h-60 overflow-y-auto">

                            <!-- 动态生成沟通记录 -->
                        </div>
                        <!-- 空状态 -->
                        <div id="communicationEmpty" class="hidden p-4 text-center text-gray-500 text-sm">

                            <p class="mt-2">暂无沟通记录</p>

                </div>
            </div>
        </div>

        <!-- 模态框底部 -->
        <div class="flex justify-between pt-4">
            <div id="editButtonGroup" class="hidden">
                <button id="editButton" onclick="enableStudentEdit()"
                        class="px-4 py-2 text-sm font-medium text-white bg-blue-600 border border-blue-600 rounded-md hover:bg-blue-700">
                    <span class="material-symbols-outlined text-sm mr-1 align-middle">edit</span>
                    <span class="align-middle">编辑</span>

            </div>
            <div class="flex gap-2">

                <button id="saveButton" onclick="saveStudentInfo()"
                        class="hidden px-4 py-2 text-sm font-medium text-white bg-green-600 border border-green-600 rounded-md hover:bg-green-700">
                    <span class="material-symbols-outlined text-sm mr-1 align-middle">save</span>

<!-- 新增沟通记录弹窗（班主任端） -->
<div id="addStudentCommunicationModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
    <div class="relative top-20 mx-auto p-0 border-0 w-full max-w-md shadow-2xl rounded-xl bg-white">
        <div class="bg-blue-600 px-5 py-3 rounded-t-xl">
            <div class="flex items-center justify-between">
                <h3 class="text-base font-semibold text-white">新增沟通记录</h3>
                <button onclick="closeAddStudentCommunicationModal()" class="text-white hover:text-blue-100">
                    <span class="material-symbols-outlined text-lg">close</span>
                </button>
            </div>
        </div>
        <form id="addStudentCommunicationForm" onsubmit="submitStudentCommunicationRecord(event)" class="p-5 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">沟通内容</label>
                <textarea id="studentCommunicationContent" name="content" rows="4" required
                          class="block w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                          placeholder="请输入客户阶段沟通内容..."></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">沟通时间</label>
                <input type="datetime-local" id="studentCommunicationTime" name="communication_time"
                       class="block w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex justify-end space-x-3">
                <button type="button" onclick="closeAddStudentCommunicationModal()"
                        class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50">
                    取消
                </button>
                <button type="submit"
                        class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700">
                    保存
                </button>
            </div>
        </form>
    </div>
</div>

<script>
let currentStudentData = null;
let currentStudentLeadId = null;
let currentStudentCustomerId = null;
let currentStudentIsCustomer = false;

// 显示学员详情弹窗
function showStudentDetailModal(studentId, isCustomer = false, hideContactInfo = false) {
    const modal = document.getElementById('studentDetailModal');
    const loading = document.getElementById('studentDetailLoading');
    const content = document.getElementById('studentDetailContent');

    // 显示模态框和加载状态
    modal.classList.remove('hidden');
    loading.classList.remove('hidden');
    content.classList.add('hidden');

    // 根据类型选择API端点
    const endpoint = isCustomer ? `/customers/${studentId}/api` : `/leads/${studentId}/api`;

    // 获取学员详情数据
    fetch(endpoint)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                currentStudentData = data;
                currentStudentIsCustomer = isCustomer;
                currentStudentCustomerId = isCustomer ? data.customer?.id || null : null;
                currentStudentLeadId = isCustomer ? data.customer?.lead_id || null : data.lead?.id || null;

                populateStudentDetail(data, isCustomer, hideContactInfo);
                loading.classList.add('hidden');
                content.classList.remove('hidden');
            } else {
                throw new Error(data.message || '获取数据失败');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('获取学员详情失败：' + error.message);
            closeStudentDetailModal();
        });
}

// 填充学员详情数据
function populateStudentDetail(data, isCustomer, hideContactInfo = false) {
    const studentData = isCustomer ? data.customer : data.lead;

    // 基本信息
    document.getElementById('studentName').textContent = studentData.student_name || '-';
    document.getElementById('parentWechatDisplayName').textContent = studentData.parent_wechat_display_name || '-';

    // 年级 - 填充显示和编辑字段
    document.getElementById('gradeDisplay').textContent = studentData.grade || '-';
    document.getElementById('gradeEdit').value = studentData.grade || '';

    // 学校 - 填充显示和编辑字段
    document.getElementById('schoolDisplay').textContent = studentData.school || '-';
    document.getElementById('schoolEdit').value = studentData.school || '';

    // 行政区 - 填充显示和编辑字段
    document.getElementById('districtDisplay').textContent = studentData.district || '-';
    document.getElementById('districtEdit').value = studentData.district || '';

    // 根据参数决定是否显示联系方式
    const contactInfoRow = document.getElementById('contactInfoRow');
    if (hideContactInfo) {
        contactInfoRow.classList.add('hidden');
    } else {
        contactInfoRow.classList.remove('hidden');
        document.getElementById('contactInfo').textContent = studentData.contact_info || '-';
    }

    // 显示编辑按钮（仅班主任且是客户）
    const editButtonGroup = document.getElementById('editButtonGroup');
    if (isCustomer && typeof currentUserRole !== 'undefined' && currentUserRole === 'teacher_supervisor') {
        editButtonGroup.classList.remove('hidden');
    } else {
        editButtonGroup.classList.add('hidden');
    }

    // 服务内容（线索和客户都显示）
    const serviceContent = document.getElementById('serviceContent');
    serviceContent.classList.remove('hidden');

    // 显示服务内容
    if (isCustomer) {
        // 显示客户的服务内容
        displayServiceRows(studentData);
    } else {
        // 显示线索的服务内容
        displayDefaultServiceRows(studentData);
    }

    // 显示沟通记录
    displayCommunications(studentData.communications || [], isCustomer);

    // 控制新增沟通记录按钮显示
    const addButton = document.getElementById('addCommunicationButton');
    if (addButton) {
        const canAdd = isCustomer && typeof currentUserRole !== 'undefined' && currentUserRole === 'teacher_supervisor';
        if (canAdd) {
            addButton.classList.remove('hidden');
        } else {
            addButton.classList.add('hidden');
        }
    }
}

// 显示服务内容表格（客户）
function displayServiceRows(studentData) {
    const serviceTableBody = document.getElementById('serviceTableBody');
    serviceTableBody.innerHTML = ''; // 清空表格

    const serviceTypes = studentData.service_types || [];

    // 课题辅导
    if (serviceTypes.includes('tutoring')) {
        const thesisText = studentData.thesis_name || '已选择';
        const row = document.createElement('tr');
        row.innerHTML = `
            <td class="px-3 py-2 text-sm text-gray-600 bg-gray-50 w-1/3">
                <div class="flex items-center">
                    <span class="material-symbols-outlined text-blue-600 mr-2 text-sm">book</span>
                    <span>课题辅导</span>
                </div>
            </td>
            <td class="px-3 py-2 text-sm font-medium text-gray-900">${thesisText}</td>
        `;
        serviceTableBody.appendChild(row);
    }

    // 竞赛辅导
    if (serviceTypes.includes('competition')) {
        const awardText = studentData.competition_award_level || studentData.award_requirement || '无要求';

        const row = document.createElement('tr');
        row.innerHTML = `
            <td class="px-3 py-2 text-sm text-gray-600 bg-gray-50">
                <div class="flex items-center">
                    <span class="material-symbols-outlined text-purple-600 mr-2 text-sm">military_tech</span>
                    <span>竞赛辅导</span>
                </div>
            </td>
            <td class="px-3 py-2 text-sm font-medium text-gray-900">${awardText}</td>
        `;
        serviceTableBody.appendChild(row);
    }

    // 升学陪跑
    if (serviceTypes.includes('upgrade_guidance')) {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td class="px-3 py-2 text-sm text-gray-600 bg-gray-50">
                <div class="flex items-center">
                    <span class="material-symbols-outlined text-green-600 mr-2 text-sm">trending_up</span>
                    <span>升学陪跑</span>
                </div>
            </td>
            <td class="px-3 py-2 text-sm font-medium text-gray-900">已选择</td>
        `;
        serviceTableBody.appendChild(row);
    }

    // 额外要求
    if (studentData.additional_requirements) {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td class="px-3 py-2 text-sm text-gray-600 bg-gray-50">
                <div class="flex items-center">
                    <span class="material-symbols-outlined text-red-600 mr-2 text-sm">add_circle</span>

            </td>
            <td class="px-3 py-2 text-sm font-medium text-gray-900">${studentData.additional_requirements}</td>
        `;
        serviceTableBody.appendChild(row);
    }
}

// 显示沟通记录
function displayCommunications(communications, isCustomer) {
    const communicationContent = document.getElementById('communicationContent');
    const communicationList = document.getElementById('communicationList');
    const communicationEmpty = document.getElementById('communicationEmpty');
    const communicationTitle = document.getElementById('communicationTitle');

    // 设置标题
    communicationTitle.textContent = isCustomer ? '客户阶段沟通记录' : '线索阶段沟通记录';

    // 显示沟通记录区域
    communicationContent.classList.remove('hidden');

    // 清空列表
    communicationList.innerHTML = '';

    if (communications && communications.length > 0) {
        communicationEmpty.classList.add('hidden');

        communications.forEach(comm => {
            const userName = comm.user_name || '未知用户';
            const userInfo = `${userName}老师`;

            const commDiv = document.createElement('div');
            commDiv.className = 'p-3 bg-white hover:bg-gray-50';
            commDiv.innerHTML = `
                <div class="flex items-start">
                    <span class="material-symbols-outlined text-blue-600 mr-2 text-sm mt-0.5">chat_bubble</span>
                    <div class="flex-1">
                        <p class="text-sm text-gray-900 whitespace-pre-wrap">${comm.content}</p>
                        <div class="flex items-center gap-2 mt-1">
                            <p class="text-xs text-gray-500">${comm.created_at}</p>
                            ${comm.user_name ? `<span class="text-xs text-gray-400">•</span><p class="text-xs text-gray-600">${userInfo}</p>` : ''}
                        </div>
                    </div>
                </div>
            `;
            communicationList.appendChild(commDiv);
        });
    } else {
        communicationEmpty.classList.remove('hidden');
    }
}

function showAddStudentCommunicationModal() {
    if (!currentStudentIsCustomer || !currentStudentLeadId) {
        return;
    }

    const modal = document.getElementById('addStudentCommunicationModal');
    if (modal) {
        const timeInput = document.getElementById('studentCommunicationTime');
        if (timeInput) {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            timeInput.value = now.toISOString().slice(0, 16);
        }

        modal.classList.remove('hidden');
        const contentInput = document.getElementById('studentCommunicationContent');
        if (contentInput) {
            setTimeout(() => contentInput.focus(), 100);
        }
    }
}

function closeAddStudentCommunicationModal() {
    const modal = document.getElementById('addStudentCommunicationModal');
    if (modal) {
        modal.classList.add('hidden');
        const form = document.getElementById('addStudentCommunicationForm');
        if (form) {
            form.reset();
        }
    }
}

function submitStudentCommunicationRecord(event) {
    event.preventDefault();

    if (!currentStudentLeadId) {
        alert('无法获取学员信息');
        return;
    }

    const form = event.target;
    const formData = new FormData(form);
    const submitBtn = form.querySelector('button[type="submit"]');
    const originalText = submitBtn.textContent;

    submitBtn.textContent = '保存中...';
    submitBtn.disabled = true;

    fetch(`/consultations/add_communication/${currentStudentLeadId}`, {
        method: 'POST',
        body: formData,
        headers: {
            'X-Requested-With': 'XMLHttpRequest',
            'Accept': 'application/json'
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            closeAddStudentCommunicationModal();
            reloadStudentCommunications();
            if (typeof showCustomerNotification === 'function') {
                showCustomerNotification('沟通记录添加成功！', 'success');
            } else {
                alert('沟通记录添加成功！');
            }
        } else {
            throw new Error(data.message || '添加失败');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        if (typeof showCustomerNotification === 'function') {
            showCustomerNotification('添加沟通记录失败：' + error.message, 'error');
        } else {
            alert('添加沟通记录失败：' + error.message);
        }
    })
    .finally(() => {
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
    });
}

function reloadStudentCommunications() {
    if (!currentStudentIsCustomer || !currentStudentCustomerId) {
        return;
    }

    fetch(`/customers/${currentStudentCustomerId}/api`)
        .then(response => response.json())
        .then(data => {
            if (data.success && data.customer) {
                const communications = data.customer.communications || [];
                displayCommunications(communications, true);
            }
        })
        .catch(error => {
            console.error('Error reloading communications:', error);
        });
}

// 启用编辑模式
function enableStudentEdit() {
    // 隐藏显示字段，显示编辑字段
    document.getElementById('gradeDisplay').classList.add('hidden');
    document.getElementById('gradeEdit').classList.remove('hidden');

    document.getElementById('schoolDisplay').classList.add('hidden');
    document.getElementById('schoolEdit').classList.remove('hidden');

    document.getElementById('districtDisplay').classList.add('hidden');
    document.getElementById('districtEdit').classList.remove('hidden');

    // 切换按钮显示
    document.getElementById('editButton').classList.add('hidden');
    document.getElementById('saveButton').classList.remove('hidden');
    document.getElementById('cancelEditButton').classList.remove('hidden');
    document.getElementById('closeButton').classList.add('hidden');
}

// 取消编辑
function cancelStudentEdit() {
    // 恢复原始值
    const studentData = currentStudentData.customer;
    document.getElementById('gradeEdit').value = studentData.grade || '';
    document.getElementById('schoolEdit').value = studentData.school || '';
    document.getElementById('districtEdit').value = studentData.district || '';

    // 隐藏编辑字段，显示显示字段
    document.getElementById('gradeDisplay').classList.remove('hidden');
    document.getElementById('gradeEdit').classList.add('hidden');

    document.getElementById('schoolDisplay').classList.remove('hidden');
    document.getElementById('schoolEdit').classList.add('hidden');

    document.getElementById('districtDisplay').classList.remove('hidden');
    document.getElementById('districtEdit').classList.add('hidden');

    // 切换按钮显示
    document.getElementById('editButton').classList.remove('hidden');
    document.getElementById('saveButton').classList.add('hidden');
    document.getElementById('cancelEditButton').classList.add('hidden');
    document.getElementById('closeButton').classList.remove('hidden');
}

// 保存学员信息
function saveStudentInfo() {
    const customerId = currentStudentData.customer.id;
    const grade = document.getElementById('gradeEdit').value;
    const school = document.getElementById('schoolEdit').value;
    const district = document.getElementById('districtEdit').value;

    // 发送更新请求
    fetch(`/customers/${customerId}/update_basic_info`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            grade: grade,
            school: school,
            district: district
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // 更新显示字段
            document.getElementById('gradeDisplay').textContent = grade || '-';
            document.getElementById('schoolDisplay').textContent = school || '-';
            document.getElementById('districtDisplay').textContent = district || '-';

            // 更新缓存数据
            currentStudentData.customer.grade = grade;
            currentStudentData.customer.school = school;
            currentStudentData.customer.district = district;

            // 退出编辑模式
            cancelStudentEdit();

            // 显示成功消息
            alert('保存成功！');

            // 刷新页面以更新列表
            location.reload();
        } else {
            alert('保存失败：' + data.message);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('保存失败：' + error.message);
    });
}

// 关闭学员详情弹窗
function closeStudentDetailModal() {
    const modal = document.getElementById('studentDetailModal');
    modal.classList.add('hidden');
    currentStudentData = null;
    currentStudentLeadId = null;
    currentStudentCustomerId = null;
    currentStudentIsCustomer = false;

    // 重置状态
    document.getElementById('studentDetailLoading').classList.remove('hidden');
    document.getElementById('studentDetailContent').classList.add('hidden');
    document.getElementById('serviceContent').classList.add('hidden');
    document.getElementById('communicationContent').classList.add('hidden');

    closeAddStudentCommunicationModal();

    // 清空服务内容表格
    const serviceTableBody = document.getElementById('serviceTableBody');
    if (serviceTableBody) {
        serviceTableBody.innerHTML = '';
    }

    // 清空沟通记录
    const communicationList = document.getElementById('communicationList');
    if (communicationList) {
        communicationList.innerHTML = '';
    }
}



// 点击模态框外部关闭
document.getElementById('studentDetailModal').addEventListener('click', function(e) {
    if (e.target === this) {
        closeStudentDetailModal();
    }
});
</script>
