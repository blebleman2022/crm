<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站维护中 - EduConnect CRM</title>
    <style>
        :root {
            color-scheme: light;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f7fb;
            color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 560px;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
            padding: 32px 28px;
            text-align: center;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 28px;
            line-height: 1.2;
        }
        p {
            margin: 0;
            color: #4b5563;
            line-height: 1.7;
        }
        .admin-entry {
            position: fixed;
            top: 0;
            right: 0;
            width: 72px;
            height: 72px;
            z-index: 50;
            opacity: 0;
        }
        .admin-entry:focus-visible {
            opacity: 0.18;
            outline: 2px dashed #60a5fa;
            outline-offset: -2px;
            background: #dbeafe;
        }
    </style>
</head>
<body>
    <a class="admin-entry" href="{{ url_for('auth.login', maintenance_entry='admin') }}" aria-label="管理员入口"></a>
    <div class="card">
        <h1>网站正在维护中</h1>
        <p>系统正在进行临时维护，请稍后再访问。</p>
    </div>
</body>
</html>
