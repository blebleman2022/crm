{% extends "base.html" %}

{% block title %}首次登录修改密码 - EduConnect CRM{% endblock %}

{% block content %}
<div class="flex h-screen w-full items-center justify-center bg-gray-50">
    <div class="w-full max-w-md px-8">
        <div class="bg-white rounded-lg shadow-lg p-8">
            <div class="mb-6 text-center">
                <h2 class="text-2xl font-bold tracking-tight text-slate-900">首次登录需修改密码</h2>
                <p class="mt-2 text-sm text-slate-600">为保障账号安全，请先修改初始密码再继续使用系统。</p>
            </div>

            <form method="POST" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700" for="current_password">当前密码</label>
                    <input id="current_password" name="current_password" type="password" required
                           class="mt-1 form-input block w-full rounded-md border border-slate-300 px-4 py-3 shadow-sm focus:border-[#177ccf] focus:outline-none focus:ring-1 focus:ring-[#177ccf]"
                           placeholder="请输入当前密码（初始密码为123456）"/>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700" for="new_password">新密码</label>
                    <input id="new_password" name="new_password" type="password" required minlength="6" maxlength="32"
                           class="mt-1 form-input block w-full rounded-md border border-slate-300 px-4 py-3 shadow-sm focus:border-[#177ccf] focus:outline-none focus:ring-1 focus:ring-[#177ccf]"
                           placeholder="请输入新密码（6-32位）"/>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700" for="confirm_password">确认新密码</label>
                    <input id="confirm_password" name="confirm_password" type="password" required minlength="6" maxlength="32"
                           class="mt-1 form-input block w-full rounded-md border border-slate-300 px-4 py-3 shadow-sm focus:border-[#177ccf] focus:outline-none focus:ring-1 focus:ring-[#177ccf]"
                           placeholder="请再次输入新密码"/>
                </div>

                <button type="submit"
                        class="w-full rounded-md bg-[#177ccf] py-3 text-sm font-semibold text-white hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-[#177ccf] focus:ring-offset-2">
                    保存并进入系统
                </button>
            </form>

            <div class="mt-4 text-center">
                <a href="{{ url_for('auth.logout') }}" class="text-sm text-gray-500 hover:text-gray-700">退出登录</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
