{% extends "admin/base.html" if current_user.is_admin() else "leads/base.html" %}

{% block title %}添加老师 - EduConnect CRM{% endblock %}
{% block page_title %}添加老师{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="bg-white p-6 rounded-lg shadow-sm">
        <div class="mb-6">
            <h2 class="text-xl font-semibold text-gray-900">添加新老师</h2>
            <p class="mt-1 text-sm text-gray-600">请填写老师的详细信息</p>
        </div>

        <form method="POST" action="{{ url_for('teachers.add_teacher') }}">
            <div class="space-y-6">
                <!-- 基本信息 -->
                <div class="border-b border-gray-200 pb-6">
                    <h3 class="text-lg font-medium text-gray-900 mb-4">基本信息</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="chinese_name" class="block text-sm font-medium text-gray-700">
                                姓名 <span class="text-red-500">*</span>
                            </label>
                            <input type="text" 
                                   name="chinese_name" 
                                   id="chinese_name" 
                                   required
                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm"
                                   placeholder="请输入姓名">
                        </div>

                        <div>
                            <label for="phone" class="block text-sm font-medium text-gray-700">
                                登录手机号 <span class="text-red-500">*</span>
                            </label>
                            <input type="tel"
                                   name="phone"
                                   id="phone"
                                   required
                                   maxlength="11"
                                   pattern="[0-9]{11}"
                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm"
                                   placeholder="请输入11位登录手机号">
                            <p class="mt-1 text-xs text-gray-500">该手机号将用于老师端登录。</p>
                        </div>

                        <div>
                            <label for="wechat" class="block text-sm font-medium text-gray-700">
                                微信号
                            </label>
                            <input type="text"
                                   name="wechat"
                                   id="wechat"
                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm"
                                   placeholder="请输入微信号">
                        </div>

                        <div>
                            <label for="current_institution" class="block text-sm font-medium text-gray-700">
                                现单位
                            </label>
                            <input type="text" 
                                   name="current_institution" 
                                   id="current_institution" 
                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm"
                                   placeholder="请输入现单位">
                        </div>

                        <div>
                            <label for="major_direction" class="block text-sm font-medium text-gray-700">
                                擅长专业方向
                            </label>
                            <input type="text" 
                                   name="major_direction" 
                                   id="major_direction" 
                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm"
                                   placeholder="请输入擅长专业方向">
                        </div>

                    </div>
                </div>

                <!-- 详细信息 -->
                <div class="border-b border-gray-200 pb-6">
                    <h3 class="text-lg font-medium text-gray-900 mb-4">详细信息</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">
                                学历信息（可删除任一行）
                            </label>
                            <div class="mt-2 space-y-3">
                                <div id="education-row-phd" class="rounded-md border border-gray-200 p-3">
                                    <div class="mb-2 flex items-center justify-between">
                                        <span class="text-sm font-semibold text-gray-900">博士</span>
                                        <button type="button"
                                                onclick="removeEducationRow('phd')"
                                                class="text-sm text-red-600 hover:text-red-800">删除该行</button>
                                    </div>
                                    <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
                                        <input type="text"
                                               name="education_phd_school"
                                               placeholder="毕业学校（可选）"
                                               class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                                        <input type="text"
                                               name="education_phd_major"
                                               placeholder="专业方向（可选）"
                                               class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                                    </div>
                                    <input type="hidden" id="education-removed-phd" name="education_phd_removed" value="0">
                                </div>

                                <div id="education-row-master" class="rounded-md border border-gray-200 p-3">
                                    <div class="mb-2 flex items-center justify-between">
                                        <span class="text-sm font-semibold text-gray-900">硕士</span>
                                        <button type="button"
                                                onclick="removeEducationRow('master')"
                                                class="text-sm text-red-600 hover:text-red-800">删除该行</button>
                                    </div>
                                    <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
                                        <input type="text"
                                               name="education_master_school"
                                               placeholder="毕业学校（可选）"
                                               class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                                        <input type="text"
                                               name="education_master_major"
                                               placeholder="专业方向（可选）"
                                               class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                                    </div>
                                    <input type="hidden" id="education-removed-master" name="education_master_removed" value="0">
                                </div>

                                <div id="education-row-bachelor" class="rounded-md border border-gray-200 p-3">
                                    <div class="mb-2 flex items-center justify-between">
                                        <span class="text-sm font-semibold text-gray-900">本科</span>
                                        <button type="button"
                                                onclick="removeEducationRow('bachelor')"
                                                class="text-sm text-red-600 hover:text-red-800">删除该行</button>
                                    </div>
                                    <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
                                        <input type="text"
                                               name="education_bachelor_school"
                                               placeholder="毕业学校（可选）"
                                               class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                                        <input type="text"
                                               name="education_bachelor_major"
                                               placeholder="专业方向（可选）"
                                               class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                                    </div>
                                    <input type="hidden" id="education-removed-bachelor" name="education_bachelor_removed" value="0">
                                </div>
                            </div>
                        </div>

                        <div>
                            <label for="research_achievements" class="block text-sm font-medium text-gray-700">
                                科研成果
                            </label>
                            <textarea name="research_achievements" 
                                      id="research_achievements" 
                                      rows="5"
                                      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm"
                                      placeholder="请输入科研成果"></textarea>
                        </div>

                        <div>
                            <label for="social_roles" class="block text-sm font-medium text-gray-700">
                                个人荣誉
                            </label>
                            <textarea name="social_roles"
                                      id="social_roles"
                                      rows="4"
                                      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm"
                                      placeholder="请输入个人荣誉"></textarea>
                        </div>

                        <div>
                            <label for="innovation_coaching_achievements" class="block text-sm font-medium text-gray-700">
                                辅导成果
                            </label>
                            <textarea name="innovation_coaching_achievements" 
                                      id="innovation_coaching_achievements" 
                                      rows="4"
                                      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm"
                                      placeholder="请输入辅导成果"></textarea>
                        </div>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="flex justify-end space-x-3">
                    <a href="{{ url_for('teachers.list_teachers') }}" 
                       class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                        取消
                    </a>
                    <button type="submit" 
                            class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700">
                        <span class="material-symbols-outlined mr-1 text-sm">save</span>
                        保存
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
function removeEducationRow(level) {
    const row = document.getElementById(`education-row-${level}`);
    const removedInput = document.getElementById(`education-removed-${level}`);
    if (!row || !removedInput) return;

    row.querySelectorAll('input[type="text"]').forEach(input => {
        input.value = '';
    });
    row.classList.add('hidden');
    removedInput.value = '1';
}

document.getElementById('phone').addEventListener('input', function(e) {
    let value = e.target.value.replace(/\D/g, '');
    if (value.length > 11) {
        value = value.slice(0, 11);
    }
    e.target.value = value;
});

document.querySelector('form').addEventListener('submit', function(e) {
    const phone = document.getElementById('phone').value;
    if (!/^1[3-9]\d{9}$/.test(phone)) {
        e.preventDefault();
        alert('请输入正确的11位手机号');
    }
});
</script>
{% endblock %}
