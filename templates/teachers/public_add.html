<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老师信息填写 - EduConnect CRM</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div class="min-h-screen py-10 px-4">
        <div class="mx-auto w-full max-w-4xl rounded-xl bg-white p-6 shadow-sm sm:p-8">
            <div class="mb-6">
                <h1 class="text-2xl font-semibold">老师信息填写</h1>
                <p class="mt-2 text-sm text-slate-600">
                    请填写真实信息。提交后将进入后台审核，账号默认禁用，审核通过后管理员会启用。
                </p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="mb-6 space-y-2">
                        {% for category, message in messages %}
                            <div class="rounded-md border px-4 py-3 text-sm
                                {% if category == 'error' %}border-red-200 bg-red-50 text-red-700{% endif %}
                                {% if category == 'success' %}border-green-200 bg-green-50 text-green-700{% endif %}
                                {% if category == 'info' %}border-blue-200 bg-blue-50 text-blue-700{% endif %}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('teachers.public_add_teacher') }}" class="space-y-6">
                <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
                    <div>
                        <label for="chinese_name" class="block text-sm font-medium text-slate-700">
                            姓名 <span class="text-red-500">*</span>
                        </label>
                        <input type="text"
                               id="chinese_name"
                               name="chinese_name"
                               required
                               class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm"
                               placeholder="请输入姓名">
                    </div>
                    <div>
                        <label for="phone" class="block text-sm font-medium text-slate-700">
                            登录手机号 <span class="text-red-500">*</span>
                        </label>
                        <input type="tel"
                               id="phone"
                               name="phone"
                               required
                               maxlength="11"
                               pattern="[0-9]{11}"
                               class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm"
                               placeholder="请输入11位手机号">
                    </div>
                    <div>
                        <label for="current_institution" class="block text-sm font-medium text-slate-700">现单位</label>
                        <input type="text"
                               id="current_institution"
                               name="current_institution"
                               class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm"
                               placeholder="请输入现单位">
                    </div>
                    <div>
                        <label for="major_direction" class="block text-sm font-medium text-slate-700">擅长专业方向</label>
                        <input type="text"
                               id="major_direction"
                               name="major_direction"
                               class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm"
                               placeholder="请输入擅长专业方向">
                    </div>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700">学历信息（可删除任一行）</label>
                        <div class="mt-2 space-y-3">
                            <div id="education-row-phd" class="rounded-md border border-slate-200 p-3">
                                <div class="mb-2 flex items-center justify-between">
                                    <span class="text-sm font-semibold text-slate-900">博士</span>
                                    <button type="button"
                                            onclick="removeEducationRow('phd')"
                                            class="text-sm text-red-600 hover:text-red-800">删除该行</button>
                                </div>
                                <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
                                    <input type="text"
                                           name="education_phd_school"
                                           placeholder="毕业学校（可选）"
                                           class="block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                                    <input type="text"
                                           name="education_phd_major"
                                           placeholder="专业方向（可选）"
                                           class="block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                                </div>
                                <input type="hidden" id="education-removed-phd" name="education_phd_removed" value="0">
                            </div>

                            <div id="education-row-master" class="rounded-md border border-slate-200 p-3">
                                <div class="mb-2 flex items-center justify-between">
                                    <span class="text-sm font-semibold text-slate-900">硕士</span>
                                    <button type="button"
                                            onclick="removeEducationRow('master')"
                                            class="text-sm text-red-600 hover:text-red-800">删除该行</button>
                                </div>
                                <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
                                    <input type="text"
                                           name="education_master_school"
                                           placeholder="毕业学校（可选）"
                                           class="block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                                    <input type="text"
                                           name="education_master_major"
                                           placeholder="专业方向（可选）"
                                           class="block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                                </div>
                                <input type="hidden" id="education-removed-master" name="education_master_removed" value="0">
                            </div>

                            <div id="education-row-bachelor" class="rounded-md border border-slate-200 p-3">
                                <div class="mb-2 flex items-center justify-between">
                                    <span class="text-sm font-semibold text-slate-900">本科</span>
                                    <button type="button"
                                            onclick="removeEducationRow('bachelor')"
                                            class="text-sm text-red-600 hover:text-red-800">删除该行</button>
                                </div>
                                <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
                                    <input type="text"
                                           name="education_bachelor_school"
                                           placeholder="毕业学校（可选）"
                                           class="block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                                    <input type="text"
                                           name="education_bachelor_major"
                                           placeholder="专业方向（可选）"
                                           class="block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                                </div>
                                <input type="hidden" id="education-removed-bachelor" name="education_bachelor_removed" value="0">
                            </div>
                        </div>
                    </div>

                    <div>
                        <label for="research_achievements" class="block text-sm font-medium text-slate-700">科研成果</label>
                        <textarea id="research_achievements"
                                  name="research_achievements"
                                  rows="5"
                                  class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm"
                                  placeholder="请输入科研成果"></textarea>
                    </div>
                    <div>
                        <label for="social_roles" class="block text-sm font-medium text-slate-700">个人荣誉</label>
                        <textarea id="social_roles"
                                  name="social_roles"
                                  rows="4"
                                  class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm"
                                  placeholder="请输入个人荣誉"></textarea>
                    </div>
                    <div>
                        <label for="innovation_coaching_achievements" class="block text-sm font-medium text-slate-700">科创辅导成果</label>
                        <textarea id="innovation_coaching_achievements"
                                  name="innovation_coaching_achievements"
                                  rows="4"
                                  class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm"
                                  placeholder="请输入科创辅导成果"></textarea>
                    </div>
                </div>

                <div class="flex justify-end">
                    <button type="submit"
                            class="inline-flex items-center rounded-md border border-transparent bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">
                        提交信息
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
    const phoneInput = document.getElementById('phone');
    function removeEducationRow(level) {
        const row = document.getElementById(`education-row-${level}`);
        const removedInput = document.getElementById(`education-removed-${level}`);
        if (!row || !removedInput) return;

        row.querySelectorAll('input[type="text"]').forEach(input => {
            input.value = '';
        });
        row.classList.add('hidden');
        removedInput.value = '1';
    }

    if (phoneInput) {
        phoneInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 11) {
                value = value.slice(0, 11);
            }
            e.target.value = value;
        });
    }

    document.querySelector('form').addEventListener('submit', function(e) {
        const phone = phoneInput ? phoneInput.value : '';
        if (!/^1[3-9]\d{9}$/.test(phone)) {
            e.preventDefault();
            alert('请输入正确的11位手机号');
        }
    });
    </script>
</body>
</html>
